[package]
name = "rustdesk-config-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "RustDesk 配置中心 + 自定义更新服务器(远程下发 host/key/api,自定义 /version/latest)"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
