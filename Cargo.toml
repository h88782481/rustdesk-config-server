[package]
name = "rustdesk-config-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "RustDesk 配置中心 + 自定义更新服务器(远程下发 host/key/api,签名的应用内更新)"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.2"
md-5 = "0.10"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"

[profile.release]
strip = true
